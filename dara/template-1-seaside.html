<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арт Сладкарница Дара — Царево | Здравословни торти от природата</title>
<meta name="description" content="Ръчно правени здравословни торти, сурови десерти и брънч в град Царево. Веган, без захар и без глутен опции. Арт Сладкарница Дара.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================
   ШАБЛОН 1 — „МОРСКА ВАНИЛИЯ“ / TEMPLATE 1 — SEASIDE VANILLA
   Palette: cream, sand, dusty rose, sea-glass, antique gold
   ======================================================= */
:root{
  --cream:#FBF8F2;  --sand:#F2E8DA;  --paper:#FFFFFF;
  --ink:#2C3A3D;    --ink-soft:#5C6B6E;
  --rose:#C48B8B;   --rose-soft:#EBD6D2;
  --sea:#7CA8A2;    --sea-deep:#4E7B76;  --sea-soft:#DCE9E6;
  --gold:#B18B57;
  --serif:'Cormorant Garamond', 'Georgia', serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --r:2px;
  --shadow:0 18px 40px -24px rgba(44,58,61,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0}
.eyebrow{font-family:var(--sans);font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--sea-deep);font-weight:500}
.rule{width:52px;height:1px;background:var(--gold);margin:18px 0}
.rule.c{margin:18px auto}

/* ---------- top bar ---------- */
.topbar{background:var(--ink);color:#EFE7DA;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:38px}
.topbar a{text-decoration:none;opacity:.85}
.topbar a:hover{opacity:1}
.lang{display:flex;gap:2px;align-items:center}
.lang button{background:none;border:none;color:inherit;font:inherit;letter-spacing:.16em;cursor:pointer;padding:4px 7px;opacity:.5}
.lang button.on{opacity:1;border-bottom:1px solid var(--gold)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(251,248,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--sand)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;height:86px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none}
.brand img{width:52px;height:52px;object-fit:contain}
.brand b{font-family:var(--serif);font-size:1.34rem;font-weight:400;letter-spacing:.04em;display:block;line-height:1.05}
.brand span{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sea-deep)}
nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0;font-size:.76rem;letter-spacing:.19em;text-transform:uppercase}
nav a{text-decoration:none;padding-bottom:3px;border-bottom:1px solid transparent;transition:.25s}
nav a:hover{border-color:var(--gold);color:var(--sea-deep)}
.btn{display:inline-block;border:1px solid var(--ink);padding:13px 26px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;background:none;cursor:pointer;transition:.28s;font-family:var(--sans);border-radius:var(--r)}
.btn:hover{background:var(--ink);color:var(--cream)}
.btn-fill{background:var(--ink);color:var(--cream)}
.btn-fill:hover{background:var(--sea-deep);border-color:var(--sea-deep)}
.burger{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--sand)}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;min-height:76vh;align-items:center}
.hero-copy{padding:70px 60px 70px 0}
.hero h1{font-size:clamp(2.7rem,5.4vw,4.5rem);letter-spacing:-.01em}
.hero h1 i{font-style:italic;color:var(--sea-deep)}
.hero p.lead{font-size:1.03rem;max-width:38ch;color:var(--ink-soft);margin:22px 0 32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-img{position:relative;height:100%;min-height:420px}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-badge{position:absolute;left:-56px;bottom:44px;width:132px;height:132px;border-radius:50%;background:var(--cream);display:grid;place-items:center;box-shadow:var(--shadow);padding:16px}
.hero-badge img{width:100%;height:100%;object-fit:contain}

/* ---------- usp strip ---------- */
.usp{background:var(--paper);border-bottom:1px solid var(--sand)}
.usp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.usp-item{padding:34px 24px;text-align:center;border-right:1px solid var(--sand)}
.usp-item:last-child{border-right:none}
.usp-item h4{font-size:1.06rem;margin-bottom:5px}
.usp-item p{margin:0;font-size:.8rem;color:var(--ink-soft);letter-spacing:.04em}

/* ---------- sections ---------- */
section{padding:96px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 52px}
.sec-head h2{font-size:clamp(2rem,3.6vw,2.9rem)}
.sec-head p{color:var(--ink-soft);font-size:.95rem;margin-top:14px}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:18px;align-items:center;margin-bottom:44px}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--sand);background:var(--paper);padding:9px 20px;font-family:var(--sans);font-size:.73rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.24s;color:var(--ink-soft);border-radius:var(--r)}
.chip:hover{border-color:var(--sea)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.diets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.diet{border:1px dashed var(--sea);background:none;color:var(--sea-deep);padding:7px 16px;font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:20px;transition:.24s}
.diet.on{background:var(--sea-soft);border-style:solid}
.count{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 34px}
.card{background:var(--paper);border:1px solid var(--sand);display:flex;flex-direction:column;transition:.35s;border-radius:var(--r);overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--rose-soft)}
.card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--sand)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.card:hover .card-img img{transform:scale(1.06)}
.card-body{padding:24px 24px 26px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:1.4rem;margin-bottom:9px}
.card p{font-size:.855rem;color:var(--ink-soft);margin:0 0 16px;flex:1;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:.61rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--sea-soft);color:var(--sea-deep)}
.tag.raw{background:var(--rose-soft);color:#8E5A5A}
.price-row{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--sand);padding-top:15px}
.price{font-family:var(--serif);font-size:1.42rem;color:var(--sea-deep)}
.price small{font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-left:5px}
.card .mini{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* ---------- split feature ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:0;background:var(--paper);border:1px solid var(--sand)}
.split-img{aspect-ratio:1/1;overflow:hidden}
.split-img img{width:100%;height:100%;object-fit:cover}
.split-copy{padding:58px 56px}
.split-copy h2{font-size:clamp(1.8rem,3vw,2.5rem)}
.split-copy p{color:var(--ink-soft);font-size:.95rem}
.price-list{list-style:none;margin:22px 0 0;padding:0}
.price-list li{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px dotted var(--sand);font-size:.9rem}
.price-list li b{font-family:var(--serif);font-weight:400;font-size:1.05rem;color:var(--sea-deep);white-space:nowrap}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.gal img{aspect-ratio:3/4;object-fit:cover;width:100%;filter:saturate(.95);transition:.4s;cursor:pointer;border-radius:var(--r)}
.gal img:hover{filter:saturate(1.1);transform:scale(1.02)}
.note{background:var(--sea-soft);border-left:3px solid var(--sea);padding:22px 26px;font-size:.9rem;color:var(--ink-soft);margin-top:32px;font-style:italic}

/* ---------- contact ---------- */
.contact{background:var(--ink);color:#E9E1D5}
.contact .sec-head h2,.contact h3{color:#F6F1E8}
.contact .sec-head p{color:#B9AE9E}
.c-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;text-align:center}
.c-card{border:1px solid rgba(233,225,213,.18);padding:36px 24px;border-radius:var(--r)}
.c-card h3{font-size:1.25rem;margin-bottom:10px}
.c-card a,.c-card p{color:#C9C0B2;text-decoration:none;font-size:.92rem;margin:0}
.c-card a:hover{color:var(--gold)}

/* ---------- footer ---------- */
footer{background:#222D30;color:#8E8577;padding:46px 0;font-size:.78rem;letter-spacing:.08em}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer a{color:#B7AC9C;text-decoration:none}
footer a:hover{color:var(--gold)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(28,36,38,.94);display:none;place-items:center;z-index:200;padding:30px}
.lb.on{display:grid}
.lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:var(--r)}
.lb button{position:absolute;top:22px;right:28px;background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;line-height:1}

/* ---------- responsive ---------- */
@media(max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .hero-copy{padding:60px 0 46px;order:2}
  .hero-img{order:1;min-height:340px}
  .hero-badge{left:auto;right:22px;bottom:-40px;width:104px;height:104px}
  .usp-grid{grid-template-columns:repeat(2,1fr)}
  .usp-item:nth-child(2){border-right:none}
  .usp-item:nth-child(-n+2){border-bottom:1px solid var(--sand)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .split-copy{padding:44px 32px}
  .gal{grid-template-columns:repeat(3,1fr)}
  .c-grid{grid-template-columns:1fr}
  nav ul{display:none}
  .burger{display:block}
  nav.open ul{display:flex;position:absolute;top:86px;left:0;right:0;background:var(--cream);flex-direction:column;gap:0;padding:10px 26px 22px;border-bottom:1px solid var(--sand)}
  nav.open ul li{padding:13px 0;border-bottom:1px solid var(--sand)}
}
@media(max-width:620px){
  section{padding:64px 0}
  .grid{grid-template-columns:1fr}
  .gal{grid-template-columns:repeat(2,1fr)}
  .hero-cta .btn{flex:1;text-align:center}
}
</style>
</head>

           en:"Every cake is made by hand and is one of a kind. That is why we do not copy designs one-to-one — we prefer to put heart and an individual approach into every order."},
  conEyebrow:{bg:"Заповядайте",en:"Come and see us"},
  conTitle:{bg:"Контакти и поръчки",en:"Contact & orders"},
  conCall:{bg:"Обадете се",en:"Call us"},
  conFind:{bg:"Намерете ни",en:"Find us"},
  conFollow:{bg:"Последвайте ни",en:"Follow us"},
  footNote:{bg:"Всяка торта е уникална и неповторима.",en:"Every cake is unique and unrepeatable."},
  address:{bg:SITE.address.bg,en:SITE.address.en},
  city:{bg:SITE.city.bg,en:SITE.city.en},
  uspItems:{
    bg:[["Само истински","ядки, фурми, кокос, мед"],["Без оцветители","естествени цветове от плодове"],["Веган & без глутен","опции за всеки режим"],["От нашия двор","смокини и сезонни плодове"]],
    en:[["Real ingredients","nuts, dates, coconut, honey"],["No colourings","natural colour from fruit"],["Vegan & gluten-free","options for every diet"],["From our garden","figs and seasonal fruit"]]
  }
};

/* safe storage — works in private mode and from file:// */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let LANG = store.get('dara-lang') || 'bg';

function setLang(l){
  LANG = l; store.set('dara-lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===l));
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    const src = COPY[k] || UI[k];
    if(src) el.textContent = src[l];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const src = COPY[el.dataset.i18nHtml];
    if(src) el.innerHTML = src[l];
  });
  document.getElementById('mapLink').href = SITE.mapsUrl;
  renderUsp(); renderFilters(); renderGrid(); renderLists(); renderDecor();
}

/* ---------- USP ---------- */
function renderUsp(){
  document.getElementById('usp').innerHTML = COPY.uspItems[LANG]
    .map(([h,p])=>`<div class="usp-item"><h4>${h}</h4><p>${p}</p></div>`).join('');
}

/* ---------- filters ---------- */
let activeCat = 'all', activeDiets = new Set();
function renderFilters(){
  document.getElementById('cats').innerHTML =
    `<button class="chip ${activeCat==='all'?'on':''}" data-c="all">${UI.all[LANG]}</button>` +
    CATEGORIES.map(c=>`<button class="chip ${activeCat===c.id?'on':''}" data-c="${c.id}">${c[LANG]}</button>`).join('');
  document.getElementById('diets').innerHTML =
    Object.entries(TAGS).map(([k,v])=>`<button class="diet ${activeDiets.has(k)?'on':''}" data-d="${k}">${v[LANG]}</button>`).join('');
  document.querySelectorAll('#cats .chip').forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;renderFilters();renderGrid();});
  document.querySelectorAll('#diets .diet').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d; activeDiets.has(d)?activeDiets.delete(d):activeDiets.add(d);
    renderFilters();renderGrid();
  });
}

/* ---------- grid ---------- */
function renderGrid(){
  const list = PRODUCTS.filter(p=>
    (activeCat==='all'||p.cat===activeCat) &&
    [...activeDiets].every(d=>p.tags.includes(d))
  );
  document.getElementById('count').textContent = list.length + ' ' + UI.results[LANG];
  const g = document.getElementById('grid');
  if(!list.length){ g.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft)">${UI.no_results[LANG]}</p>`; return; }
  g.innerHTML = list.map(p=>`
    <article class="card">
      <div class="card-img"><img src="assets/${p.img}" alt="${p[LANG].n}" loading="lazy" onclick="openLb('assets/${p.img}')"></div>
      <div class="card-body">
        <h3>${p[LANG].n}</h3>
        <p>${p[LANG].d}</p>
        ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag ${t==='raw'?'raw':''}">${TAGS[t][LANG]}</span>`).join('')}</div>`:''}
        <div class="price-row">
          <span class="price">${money(p.price)}<small>${p.unit==='slice'?UI.per_slice[LANG]:UI.per_piece[LANG]}</small></span>
          <a class="mini" href="#contact">${UI.order[LANG]}</a>
        </div>
      </div>
    </article>`).join('');
}

/* ---------- lists ---------- */
function renderLists(){
  document.getElementById('brunchList').innerHTML = BRUNCH.map(i=>
    `<li><span>${i[LANG]}</span><b>${i.price!=null?money(i.price):'—'}</b></li>`).join('');
  document.getElementById('cateringList').innerHTML = CATERING.map(i=>
    `<li><span>${i[LANG]}</span><b>${money(i.price)}</b></li>`).join('');
}

/* ---------- decor ---------- */
function renderDecor(){
  document.getElementById('galKids').innerHTML = DECOR.kids.map(f=>`<img src="assets/${f}" alt="" loading="lazy" onclick="openLb('assets/${f}')">`).join('');
  document.getElementById('galWed').innerHTML  = DECOR.wedding.map(f=>`<img src="assets/${f}" alt="" loading="lazy" onclick="openLb('assets/${f}')">`).join('');
  document.getElementById('decNote').textContent = DECOR.note[LANG];
  document.getElementById('decPrices').innerHTML = DECOR.prices.map(p=>`<li><span>${p[LANG]}</span><b>${p.price}</b></li>`).join('');
}

/* ---------- lightbox ---------- */
function openLb(src){ document.getElementById('lbImg').src = src; document.getElementById('lb').classList.add('on'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('lb').classList.remove('on'); });

/* ---------- init ---------- */
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.getElementById('yr').textContent = new Date().getFullYear();
setLang(LANG);
</script>
</body>
</html>
